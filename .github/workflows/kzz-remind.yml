name: 新债申购提醒

on:
  # 仅由 Windows 任务计划通过 workflow_dispatch 触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-bonds:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查并推送新债提醒
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python kzz_remind_cloud.py
